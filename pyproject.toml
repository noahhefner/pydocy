[project]
name = "pydocy"
version = "0.1.0"
description = "Documentation generator for Python"
readme = "README.md"
authors = [
    { name = "Noah Hefner", email = "nhefner127+github@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
pydocy = "pydocy.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
addopts = "--ignore=tests/how-tui"

[tool.ruff]
exclude = [
    "tests/how-tui",
]